<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a2233"/>
      <stop offset="55%" stop-color="#7f1022"/>
      <stop offset="100%" stop-color="#5c0918"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5c0918" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Fondo circular con gradiente vino -->
  <circle cx="64" cy="64" r="60" fill="url(#wineGradient)" filter="url(#softShadow)"/>
  <!-- Anillo interior sutil -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.2"/>
  <!-- Iniciales VS elegantes -->
  <text x="64" y="78" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="52" font-weight="700" fill="white" letter-spacing="2">VS</text>
  <!-- Detalle decorativo: pequeña corona/15 -->
  <g transform="translate(64, 100)" fill="white" opacity="0.9">
    <path d="M-16 0 L-8 -8 L0 0 L8 -8 L16 0 L8 6 L8 10 L-8 10 L-8 6 Z" stroke="none"/>
    <circle cx="0" cy="-8" r="3" fill="white"/>
    <text x="0" y="18" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="14" font-weight="700" fill="white">15</text>
  </g>
</svg>